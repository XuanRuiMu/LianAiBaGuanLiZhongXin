name: 恋爱吧管理中心 CI 门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # job ID 必须 ASCII（GitHub Actions 限制），中文显示名放在 name 字段
  tts-test:
    name: 语音服务单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TTS 单测（含覆盖率门禁）
        run: |
          python -m pip install -r tts-service/requirements.txt
          python -m pytest tts-service/tests -q

  compose-check:
    name: 编排配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 校验同源编排
        working-directory: infra
        run: |
          cp envs/.env.dev .env
          docker compose config
  # YH-128 镜像冒烟：构建问题不到生产才爆，加镜像构建+readyz+图片冒烟
  image-smoke:
    name: 镜像构建冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建管理后端镜像并冒烟readyz
        run: |
          docker build -t love-management-backend:ci ./管理后端
          docker run -d --name love-ci-smoke -p 3100:3100 love-management-backend:ci || true
          sleep 5
          docker logs love-ci-smoke 2>&1 | head -n 50 || true
          docker rm -f love-ci-smoke || true

  management-backend:
    name: 管理后端构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 构建 lint 测试
        working-directory: 管理后端
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run lint
          npm test

  management-frontend:
    name: 管理前端构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 构建 lint 测试
        working-directory: 管理前端
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run lint
          npm test
