name: 恋爱吧数据中心 CI 门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  后端单测与覆盖率:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 后端测试与 JaCoCo 门禁
        working-directory: backend-java
        run: mvn -B verify

  前端单测与类型:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 前端单测与类型检查
        working-directory: analytics-frontend
        run: |
          npm ci
          npm run test -- --run
          npx tsc --noEmit

  前端端到端:
    runs-on: ubuntu-latest
    needs: [后端单测与覆盖率, 前端单测与类型]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 启动中间件与业务服务
        working-directory: infra
        run: |
          cp envs/.env.dev .env
          docker compose up -d mysql8 redis7 kafka source-postgres
          docker compose ps
      - name: 端到端三流程
        working-directory: analytics-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

  算法服务单测:
    runs-on: ubuntu-latest
    services:
      记忆库:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: love_memory
          POSTGRES_PASSWORD: MemoryDemo2026
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d love_memory"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 初始化记忆库结构
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=MemoryDemo2026 psql -h localhost -p 55433 -U postgres -d love_memory \
            -f infra/vector-postgres/init/01_记忆追踪.sql
      - name: AI 与 TTS 单测（含覆盖率门禁）
        env:
          MEMORY_PG_URL: postgresql://postgres:MemoryDemo2026@localhost:55433/love_memory
          MEMORY_PG_PASSWORD: MemoryDemo2026
        run: |
          python -m pip install -r ai-service/requirements.txt
          python -m pytest ai-service/tests -q
          python -m pip install -r tts-service/requirements.txt
          python -m pytest tts-service/tests -q
