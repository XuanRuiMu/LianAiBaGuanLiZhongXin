name: 恋爱吧数据中心 CI 门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  后端单测与覆盖率:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 后端测试与 JaCoCo 门禁
        working-directory: backend-java
        run: mvn -B verify

  前端单测与类型:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 前端单测与类型检查
        working-directory: analytics-frontend
        run: |
          npm ci
          npm run test -- --run
          npx tsc --noEmit

  前端端到端:
    runs-on: ubuntu-latest
    needs: [后端单测与覆盖率, 前端单测与类型]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 启动中间件与业务服务
        working-directory: infra
        run: |
          cp envs/.env.dev .env
          docker compose up -d mysql8 redis7 kafka source-postgres
          docker compose ps
      - name: 端到端三流程
        working-directory: analytics-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

  算法服务单测:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AI 与 TTS 单测（含覆盖率门禁）
        run: |
          python -m pip install -r ai-service/requirements.txt
          python -m pytest ai-service/tests -q
          python -m pip install -r tts-service/requirements.txt
          python -m pytest tts-service/tests -q
