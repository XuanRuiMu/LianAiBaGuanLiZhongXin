[project]
name = "lianaiba-guanli-tts"
version = "0.1.0"
description = "恋爱吧管理中心语音服务"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "python-dotenv==1.2.4",
    "edge-tts==7.2.8",
    "PyJWT==2.15.1",
]

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false
