server:
  port: 8080

spring:
  application:
    name: love-analytics-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_GROUP_ID:love-analytics-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-min-32-bytes!!}
    ttl-hours: ${JWT_TTL_HOURS:24}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  datasource:
    analytics:
      url: ${MYSQL_URL:jdbc:mysql://localhost:3307/love_analytics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
    source:
      url: ${SOURCE_PG_URL:jdbc:postgresql://localhost:55432/love_source}
      username: ${SOURCE_PG_USERNAME:readonly}
      password: ${SOURCE_PG_PASSWORD:}
      driver-class-name: org.postgresql.Driver
  cache:
    base-ttl-seconds: ${CACHE_BASE_TTL_SECONDS:1800}
    jitter-ttl-seconds: ${CACHE_JITTER_TTL_SECONDS:300}
    empty-ttl-seconds: ${CACHE_EMPTY_TTL_SECONDS:60}
    lock-ttl-seconds: ${CACHE_LOCK_TTL_SECONDS:30}
    wait-millis: ${CACHE_WAIT_MILLIS:80}
  sync:
    enabled: ${SYNC_ENABLED:true}
    fixed-delay: ${SYNC_FIXED_DELAY:PT5M}
    initial-delay: ${SYNC_INITIAL_DELAY:PT15S}
    topic: ${KAFKA_TOPIC_SYNC:love.sync.events}
    dlt-topic: ${KAFKA_TOPIC_DLT:love.sync.events.DLT}
    trend-days: ${SYNC_TREND_DAYS:90}
    retry-count: ${SYNC_RETRY_COUNT:2}
    retry-backoff-millis: ${SYNC_RETRY_BACKOFF_MILLIS:2000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.lianai: info
