[project]
name = "love-management-tts"
version = "0.1.0"
description = "恋爱吧管理中心语音服务"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "python-dotenv==1.2.3",
    "edge-tts==7.2.8",
    "PyJWT==2.15.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false
exclude-newer = "2026-09-24T23:59:59Z"
