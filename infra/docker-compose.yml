name: love-management

services:
  management-backend:
    build: ../管理后端
    container_name: love-management-backend
    restart: unless-stopped
    ports:
      - "${MANAGEMENT_BACKEND_PORT:-3100}:3100"
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_BACKEND_PORT: 3100
      APP_ENV: ${APP_ENV:-prod}
    networks:
      - lovewithme-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3100/api/jian-kang').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tts-service:
    build: ../tts-service
    container_name: love-management-tts
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8001}:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - lovewithme-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  n8n:
    # YH-136 镜像浮动收敛：全pin digest，禁今天构建明天变
    image: n8nio/n8n:2.37.10
    container_name: love-management-n8n
    restart: unless-stopped
    # YH-134 资源上限：单容器异常禁拖垮宿主
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:?请在环境中设置N8N_USER}
      # YH-120 弱口令禁入库：无默认值，缺失即compose变量替换报错，禁admin123入库
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?请在环境中设置N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?请在环境中设置N8N_ENCRYPTION_KEY}
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n-nodes-liaolian:/home/node/.n8n/custom/n8n-nodes-liaolian:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lovewithme-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  lovewithme-network:
    # YH-142 compose自举：默认自建网，外部网覆写禁换机起不来
    driver: bridge

volumes:
  n8n_data:
