services:
  mysql8:
    image: mysql:8.0
    container_name: love-analytics-mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis7:
    image: redis:7-alpine
    container_name: love-analytics-redis7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.0
    container_name: love-analytics-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  source-postgres:
    image: postgres:16
    container_name: love-analytics-source-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
    ports:
      - "${SOURCE_PG_PORT:-55432}:5432"
    volumes:
      - source_pg_data:/var/lib/postgresql/data
      - ./source-postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${SOURCE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  vector-postgres:
    image: pgvector/pgvector:pg18
    container_name: love-analytics-vector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MEMORY_PG_DB:-love_memory}
      POSTGRES_PASSWORD: ${MEMORY_PG_PASSWORD:-MustChangeMemory2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${MEMORY_PG_PORT:-55433}:5432"
    volumes:
      - vector_pg_data:/var/lib/postgresql/data
      - ./vector-postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${MEMORY_PG_DB:-love_memory}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend-java:
    build: ../backend-java
    container_name: love-analytics-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      MYSQL_URL: jdbc:mysql://mysql8:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SOURCE_PG_URL: jdbc:postgresql://source-postgres:5432/${SOURCE_POSTGRES_DB}
      SOURCE_PG_USERNAME: postgres
      SOURCE_PG_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      REDIS_HOST: redis7
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_DIR: /app/logs
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql8:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      source-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  ai-service:
    build: ../ai-service
    container_name: love-analytics-ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      JAVA_BASE_URL: http://backend-java:8080
      CHROMA_PERSIST_DIR: /app/chroma_db
      KNOWLEDGE_DIR: /app/knowledge
    volumes:
      - ai_chroma:/app/chroma_db
    depends_on:
      backend-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  tts-service:
    build: ../tts-service
    container_name: love-tts-service
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8001}:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  analytics-frontend:
    build:
      context: ../analytics-frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
        VITE_AI_BASE: ${VITE_AI_BASE:-http://localhost:8000}
    container_name: love-analytics-frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-5174}:80"
    depends_on:
      - backend-java
      - ai-service

  n8n:
    image: n8nio/n8n:2.37.10
    container_name: love-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin123}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-key-change-me-32bytes!!}
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n-nodes-liaolian:/home/node/.n8n/custom/n8n-nodes-liaolian:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  source_pg_data:
  backend_logs:
  ai_chroma:
  n8n_data:
  vector_pg_data:
