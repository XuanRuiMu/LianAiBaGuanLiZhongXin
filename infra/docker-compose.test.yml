# 凭据规范：本文件所有口令/密钥一律 ${VAR:?...} 强制经环境变量注入，绝不硬编码入库。
# 注入方：infra/scripts/verify-isolated.sh（bash）与 infra/scripts/verify-isolated.ps1（PowerShell），
# 两者均在每次运行开始时随机生成并 export，随作业销毁；本地手动执行请先 export 同名变量，
# 变量清单与生成方式见 infra/envs/.env.test.example 头部注释。
name: lianaiba-guanli-fp04b

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: lianaiba_test
      POSTGRES_USER: lianaiba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须通过环境变量注入：由 infra/scripts/verify-isolated.sh|ps1 每次运行随机生成}
    volumes:
      - type: bind
        source: ${MIGRATIONS_ROOT:?请设置MIGRATIONS_ROOT}/database/000_baseline.sql
        target: /docker-entrypoint-initdb.d/000_baseline.sql
        read_only: true
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lianaiba -d lianaiba_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  management-backend:
    build:
      context: ../管理后端
    environment:
      APP_ENV: test
      NODE_ENV: production
      MANAGEMENT_BACKEND_PORT: 3100
      DATABASE_URL: postgresql://lianaiba:${POSTGRES_PASSWORD:?必须通过环境变量注入}@postgres:5432/lianaiba_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?必须通过环境变量注入}
      JWT_EXPIRES_IN: 15m
      ADMIN_PHONES: 13800000000
      ALLOWED_ORIGINS: http://127.0.0.1:3100
      TRUST_PROXY: loopback
      FORCE_HTTPS: "0"
      VITE_API_PROXY_TARGET: http://127.0.0.1:3100
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?必须通过环境变量注入}
      TTS_SERVICE_URL: http://tts-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1::3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/jian-kang').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  tts-service:
    build:
      context: ../YuYinFuWu
    environment:
      TTS_PROVIDER: offline
      JWT_SECRET: ${JWT_SECRET:?必须通过环境变量注入}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?必须通过环境变量注入}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1::8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.40.6@sha256:9c7871d5cc4fc2565bb905e4df5bf7d6a5a4bf2f4313fb99a2b3fa380f331d7c
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?必须通过环境变量注入}
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-fp04b-ci@example.invalid}
      N8N_INSTANCE_OWNER_FIRST_NAME: FP04B
      N8N_INSTANCE_OWNER_LAST_NAME: CI
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH:?必须通过环境变量注入（由 verify-isolated 脚本对随机口令 bcrypt 后注入）}
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n-nodes-liaolian:/home/node/.n8n/custom/n8n-nodes-liaolian:ro
    ports:
      - "127.0.0.1::5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  n8n_data:
